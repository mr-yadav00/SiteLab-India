<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | SiteLab India</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
      body {
        background-color: var(--ink, #0B0E14);
        color: var(--text-on-dark, #F3F6FB);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        font-family: var(--font-body), sans-serif;
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 5rem;
        margin-bottom: 0.5rem;
        color: var(--gold, #FFB800);
        font-family: var(--font-display), serif;
        letter-spacing: -1px;
      }
      p {
        font-size: 1.15rem;
        margin-bottom: 2rem;
        color: var(--text-on-dark-muted, #9AA9C4);
      }
      .btn {
        background: var(--gold, #FFB800);
        color: #000000;
        padding: 0.85rem 1.8rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
        font-family: var(--font-body);
        transition: transform 0.2s, box-shadow 0.2s;
        display: inline-block;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px var(--gold-glow, rgba(255,184,0,0.3));
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>Arre, aap yahan kaise aa gaye? Ye page nahi mil raha.</p>
    <a href="https://sitelabindia.in/" class="btn">Back to Home →</a>
  </body>
</html>
